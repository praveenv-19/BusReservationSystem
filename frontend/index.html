
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Reservation System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bus Reservation System</h1>
        <p>Search buses and choose your seat</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Search Buses</h2>

            <form id="searchForm">
                <label>
                    Source
                    <input id="source" type="text"
                        placeholder="e.g. Pune" required>
                </label>

                <label>
                    Destination
                    <input id="destination" type="text"
                        placeholder="e.g. Mumbai" required>
                </label>

                <label>
                    Journey date
                    <input id="travelDate" type="date" required>
                </label>

                <button type="submit">Search Buses</button>
                <button type="button" id="showAllBuses">
                    Show All Buses
                </button>
            </form>
        </section>

        <section>
            <h2>Available Buses</h2>
            <div id="busList"></div>
        </section>
    </main>

    <footer>
        <p>Bus Reservation System | DBMS Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
